sonar.projectKey=artelier-platform_artelier-web
sonar.organization=artelier-platform
sonar.projectName=artelier-web

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# shadcn/ui generated components are not analyzed
sonar.exclusions=src/components/ui/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/components/ui/**,src/types/**,src/test/**,**/*.test.ts,**/*.test.tsx
