name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build & SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud needs the full history

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # reads the version from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: pnpm test:coverage

      # "next build" also runs the TypeScript type check.
      - name: Build
        run: pnpm build
        env:
          API_URL: https://backend.example.invalid
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
          NEXT_PUBLIC_WOMPI_PUBLIC_KEY: pub_test_ci_placeholder

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
